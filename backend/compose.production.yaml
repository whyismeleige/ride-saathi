name: ride-saathi-production

services:
  backend:
    build: .
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_ECHO: ${DB_ECHO:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      DB_NULL_POOL: ${DB_NULL_POOL:-false}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8000"
      OLA_MAPS_API_KEY: ${OLA_MAPS_API_KEY:?Set OLA_MAPS_API_KEY in the production environment file or shell}
      OLA_MAPS_BASE_URL: ${OLA_MAPS_BASE_URL:-https://api.olamaps.io}
      OLA_MAPS_TIMEOUT_SECONDS: ${OLA_MAPS_TIMEOUT_SECONDS:-8}
      MAPS_RATE_LIMIT_PER_MINUTE: ${MAPS_RATE_LIMIT_PER_MINUTE:-60}
      MAPS_RATE_LIMIT_WINDOW_SECONDS: ${MAPS_RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-10}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
      TTS_VOICE_EN: ${TTS_VOICE_EN:-en-IN-NeerjaNeural}
      TTS_VOICE_HI: ${TTS_VOICE_HI:-hi-IN-SwaraNeural}
      TTS_VOICE_TE: ${TTS_VOICE_TE:-te-IN-ShrutiNeural}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-8}
      TTS_RATE_LIMIT_PER_MINUTE: ${TTS_RATE_LIMIT_PER_MINUTE:-30}
      TTS_GLOBAL_RATE_LIMIT_PER_MINUTE: ${TTS_GLOBAL_RATE_LIMIT_PER_MINUTE:-120}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
