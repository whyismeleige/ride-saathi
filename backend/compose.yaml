name: ride-saathi-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development defaults only. Production uses an external DATABASE_URL.
      POSTGRES_DB: ride_saathi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ride_saathi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    depends_on:
      postgres:
        condition: service_healthy
    build: .
    init: true
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/ride_saathi}
      DB_ECHO: ${DB_ECHO:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      DB_NULL_POOL: ${DB_NULL_POOL:-false}
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8000"
      OLA_MAPS_API_KEY: ${OLA_MAPS_API_KEY:-}
      OLA_MAPS_BASE_URL: ${OLA_MAPS_BASE_URL:-https://api.olamaps.io}
      OLA_MAPS_TIMEOUT_SECONDS: ${OLA_MAPS_TIMEOUT_SECONDS:-8}
      MAPS_RATE_LIMIT_PER_MINUTE: ${MAPS_RATE_LIMIT_PER_MINUTE:-60}
      MAPS_RATE_LIMIT_WINDOW_SECONDS: ${MAPS_RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
