name: ride-saathi-local

services:
  backend:
    build: .
    init: true
    environment:
      ENVIRONMENT: development
      PORT: "8000"
      OLA_MAPS_API_KEY: ${OLA_MAPS_API_KEY:-}
      OLA_MAPS_BASE_URL: ${OLA_MAPS_BASE_URL:-https://api.olamaps.io}
      OLA_MAPS_TIMEOUT_SECONDS: ${OLA_MAPS_TIMEOUT_SECONDS:-8}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
