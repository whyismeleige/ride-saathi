<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="leaflet.css">
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; }
    .destination-pin { background: none; border: none; }
  </style>
  <script src="leaflet.js"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    window.rideSaathiMapStatus = 'loading';
    try {
      const params = new URLSearchParams(location.search);
      const position = params.get('marker').split(',').map(Number);
      const map = L.map('map', { attributionControl: true }).setView(position, 16);
      map.attributionControl.setPrefix(false);
      const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        keepBuffer: 0,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
      });
      // A loaded HTML page alone does not mean the street map is visible.
      tiles.on('loading', () => { window.rideSaathiMapStatus = 'loading'; });
      tiles.on('load', () => {
        const images = Array.from(document.querySelectorAll('img.leaflet-tile'));
        window.rideSaathiMapStatus = images.length > 0 && images.every(
          image => image.complete && image.naturalWidth > 0
        ) ? 'ready' : 'error';
      });
      tiles.addTo(map);
      L.marker(position, {
        icon: L.divIcon({
          className: 'destination-pin',
          iconSize: [32, 44], iconAnchor: [16, 44],
          html: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44"><path d="M16 42C12 35 2 25 2 16a14 14 0 0 1 28 0c0 9-10 19-14 26z" fill="#216b60" stroke="white" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="white"/></svg>'
        }),
        keyboard: false
      }).addTo(map);
      new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
    } catch (error) {
      window.rideSaathiMapStatus = 'error';
    }
  </script>
</body>
</html>
